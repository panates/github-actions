name: "Stage Deploy"
inputs:
  token:
    description: "Github personal access token"
    default: ${{ github.token}}
  packages:
    description: "\"rman list --json\" output - each docker-targeted package's own \"docker.image\" supplies the image name, no separate image-files mapping needed"
    required: true
  docherhub-username:
    description: "DockerHub username"
    required: true
  docherhub-password:
    description: "DockerHub password"
    required: true
  dockerhub-namespace:
    description: "Dockerhub namespace - prefixed onto a bare (no \"/\") package.docker.image, same rule rman itself uses"
    required: true
  stage-files:
    description: "<cr> delimited pairing of <Package name=Stage file name>"
    required: true
runs:
  using: "node24"
  main: "dist/index.js"
