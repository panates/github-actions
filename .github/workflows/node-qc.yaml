name: Quality Check

# v3 runs on rman 2.x and on panates/gh-setup-node@v2. Two changes a caller has to know about:
#
#   - `rman-ci` is gone, replaced by `install`. It existed to choose between
#     `npm install --only=dev --no-save` and `npx rman ci`, and neither is what a QC run wants:
#     `--only=dev` is npm's deprecated spelling of `--omit=prod` and leaves out the runtime
#     dependencies a test actually imports, while `rman ci` wipes node_modules across every
#     workspace to reinstall from scratch - a repair tool, not an install. `npm ci` is the one that
#     installs exactly the lockfile, which is what CI is for.
#   - the setup action no longer deletes `package-lock.json` before installing, so what QC checks
#     is now the dependency set the lockfile pins rather than whatever resolved that morning.

on:
  workflow_call:
    inputs:
      qc_script:
        type: string
        description: 'QC script to be executed - e.g. "rman run qc --changed-since origin/main" to only lint/test packages that actually changed'
        default: "npm run qc"
      node-version:
        description: "NodeJS version"
        type: string
        default: ""
      fetch-depth:
        description: 'Commits to fetch. A qc_script using "--changed-since <ref>" needs 0 - it compares against a ref that a shallow clone does not have. v2 could not do this at all: it checked out at depth 1 twice'
        type: string
        default: "1"
      install:
        description: 'How to install dependencies: "ci" (from the lockfile), "install" (resolve fresh), or "false" (skip)'
        type: string
        default: "ci"
      github-registries:
        description: 'Scopes to route to npm.pkg.github.com (comma separated), or "auto" - needed only to install a dependency hosted there'
        type: string
        required: false
    secrets:
      PERSONAL_ACCESS_TOKEN:
        description: "Github personal access token - needed only for npm.pkg.github.com"
        required: false

jobs:
  # ***********************************
  # Job: Quality Check
  # ***********************************
  qc:
    name: Quality Check
    runs-on: ubuntu-latest
    env:
      # Floating major, not a workflow input - see node-release.yaml's own RMAN_VERSION.
      RMAN_VERSION: "2"
    steps:
      # Checks out as well, so there is no separate actions/checkout step - v2 had both, which
      # meant the repository was checked out twice on every run.
      - name: Setup Environment
        uses: panates/gh-setup-node@v2
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          fetch-depth: ${{ inputs.fetch-depth }}
          node-version: ${{ inputs.node-version }}
          github-registries: ${{ inputs.github-registries }}
          install: ${{ inputs.install }}
          rman-version: ${{ env.RMAN_VERSION }}

      - name: Run QC Tests
        run: ${{ inputs.qc_script }}
