name: "Release"
on:
  workflow_call:
    inputs:
      build_script:
        description: "Build script to be executed"
        type: string
        default: "rman build"
      workspace:
        description: "The default working directory on the runner for steps, and the default location of your repository when using the checkout action"
        type: string
        default: ${{ github.workspace }}
      node-version:
        description: "NodeJS version"
        type: string
        default: ""
      github-registries:
        description: "Namespaces of github registries (comma separated)"
        type: string
        required: false
      cache-key:
        description: "Cache key to be restored"
        type: string
        required: false
      cache-path:
        description: "Path which cache will be restored"
        type: string
        required: false
      stage-repository:
        description: "Git repository for stage files"
        type: string
      stage-repository-branch:
        description: "Git repository for stage files"
        type: string
        default: "main"
      stage-files:
        description: "<cr> delimited pairing of <Package name=Stage files>"
        type: string
    secrets:
      PERSONAL_ACCESS_TOKEN:
        description: "Github personal access token"
        required: true
      NPM_TOKEN:
        description: "npmjs.org auth token - omit entirely once the package is registered as an npm Trusted Publisher (OIDC); npm.pkg.github.com auth always uses PERSONAL_ACCESS_TOKEN regardless"
        required: false
      DOCKERHUB_NAMESPACE:
        description: "Dockerhub namespace. Required if 'stage-repository' defined, or a bare (no \"/\") publish.docker.image is used"
        required: false
      DOCKERHUB_USERNAME:
        description: "Dockerhub username. Required if any package's .rmanrc \"publish.target\" includes \"docker\""
        required: false
      DOCKERHUB_PASS:
        description: "Dockerhub password. Required if any package's .rmanrc \"publish.target\" includes \"docker\""
        required: false

permissions:
  id-token: write # npm Trusted Publishing (OIDC) - also needed on the CALLER workflow's own job
  contents: write # rman version --push, and the GitHub Release itself

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    env:
      # Pinned deliberately, not exposed as a workflow input - this workflow's own steps depend on
      # specific rman behavior ("version --yes", the "publish.docker" .rmanrc schema), so bumping
      # it is a maintenance decision made here, not something a consumer repo should be able to
      # drift independently by passing a different value.
      RMAN_VERSION: "1.0.7"
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      bumped: ${{ steps.changed.outputs.count != '0' }}

    steps:
      - name: "Setup Environment"
        uses: panates/gh-setup-node@v1
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          fetch-depth: 0 # rman's own tag/changelog detection needs full history, not just the last N commits
          node-version: ${{ inputs.node-version }}
          github-registries: ${{ inputs.github-registries }}

      - name: "Configure git identity"
        working-directory: ${{ inputs.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "Restore Cache"
        if: ${{ inputs.cache-key != '' && inputs.cache-path != '' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}

      - name: "Print Info"
        working-directory: ${{ inputs.workspace }}
        run: |
          echo "=== rman info ===" # Node + whichever package manager .rmanrc actually configures
          npx --yes "rman@$RMAN_VERSION" info

          echo "=== WORKFLOW ==="
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"

          echo "=== RESTORED CACHE ==="
          ls -R "${{ inputs.cache-path }}" 2>/dev/null || echo "Cache path not found"

      - name: "What changed"
        id: changed
        working-directory: ${{ inputs.workspace }}
        run: |
          json=$(npx --yes "rman@$RMAN_VERSION" changed --json)
          {
            echo "json=$json"
            echo "count=$(echo "$json" | jq 'length')"
            echo "names=$(echo "$json" | jq -c '[.[].name]')"
          } >> "$GITHUB_OUTPUT"
          echo "$json"

      - name: "Version"
        if: ${{ steps.changed.outputs.count != '0' }}
        working-directory: ${{ inputs.workspace }}
        run: |
          # Severity always comes from rman's own auto-detection (conventional-commit prefixes,
          # a "Release-As: patch|minor|major" commit-body footer to force a one-off exception) -
          # never a static override here, which would apply identically to every future run
          # regardless of what actually changed. Excluding a package from publish/changelog
          # entirely is .rmanrc "publish.skip" (version itself never consults it), not a workflow
          # input either - see docs/node-release.md.
          npx --yes "rman@$RMAN_VERSION" version --yes --changelog --push --allow-branch main

      - name: "Capture release tag"
        if: ${{ steps.changed.outputs.count != '0' }}
        id: tag
        working-directory: ${{ inputs.workspace }}
        run: |
          tag=$(git tag --points-at HEAD | head -n1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Released tag: $tag"

      - name: "Build"
        if: ${{ steps.changed.outputs.count != '0' }}
        working-directory: ${{ inputs.workspace }}
        shell: bash
        run: |
          ${{ inputs.build_script }}

      - name: "Release notes"
        if: ${{ steps.changed.outputs.count != '0' }}
        working-directory: ${{ inputs.workspace }}
        run: |
          # --include-skipped: every bumped package belongs in the release notes, even one that's
          # .rmanrc "publish.skip" - it just got its own version bump, the same as any other.
          args=(--include-skipped)
          for n in $(echo '${{ steps.changed.outputs.names }}' | jq -r '.[]'); do
            args+=(--scope "$n")
          done
          npx --yes "rman@$RMAN_VERSION" changelog "${args[@]}" | tee RELEASE_NOTES.md

      - name: "Ensure npm supports Trusted Publishing (OIDC)"
        if: ${{ steps.changed.outputs.count != '0' }}
        run: npm install -g npm@latest

      - name: "Configure npm auth"
        if: ${{ steps.changed.outputs.count != '0' }}
        working-directory: ${{ inputs.workspace }}
        run: |
          # Only written when actually given - a package with neither line present, and no
          # NPM_TOKEN, falls through to npm's own OIDC Trusted Publishing (see docs/node-release.md).
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
          fi
          if [ -n "${{ inputs.github-registries }}" ]; then
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.PERSONAL_ACCESS_TOKEN }}" >> ~/.npmrc
          fi

      - name: "Publish"
        if: ${{ steps.changed.outputs.count != '0' }}
        working-directory: ${{ inputs.workspace }}
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASS }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          # No --target here - each package's own .rmanrc "publish.target" is the single source of
          # truth for whether it goes to npm, docker, both, or neither (default ["npm"]). Disabling
          # a target for one run would just be a second, workflow-level place that decision could
          # live - forcing it into .rmanrc keeps it in one place.
          npx --yes "rman@$RMAN_VERSION" publish --yes

      - name: "List packages"
        id: list
        working-directory: ${{ inputs.workspace }}
        run: |
          json=$(npx --yes "rman@$RMAN_VERSION" list --json)
          echo "packages=$json" >> "$GITHUB_OUTPUT"

      - name: "Create GitHub Release"
        if: ${{ steps.changed.outputs.count != '0' }}
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          tag: ${{ steps.tag.outputs.tag }}
          bodyFile: "RELEASE_NOTES.md"
          allowUpdates: true
          draft: false
          prerelease: false
          replacesArtifacts: true

  stage_deploy:
    if: ${{ inputs.stage-repository != '' && needs.release.outputs.bumped == 'true' }}
    name: Stage Deploy
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifest repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.stage-repository }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ref: ${{ inputs.stage-repository-branch }}

      - name: Update image in deployment yaml
        uses: panates/github-actions/.github/actions/stage-deploy@v2
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          packages: ${{ needs.release.outputs.packages }}
          dockerhub-namespace: ${{ secrets.DOCKERHUB_NAMESPACE }}
          docherhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          docherhub-password: ${{ secrets.DOCKERHUB_PASS }}
          stage-files: ${{ inputs.stage-files }}
