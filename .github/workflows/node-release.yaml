name: "Release"

# **v3 runs on rman 2.x.** Three things in the v2 pipeline do not survive that major:
#
#   - `rman changed` was removed. The step calling it fails outright ("Did you mean changelog?"),
#     and it must not be ported to `version --json | select(.status=="bump")` either: that plan
#     includes the monorepo **root**, whose entry is informational and must never be published.
#     It is simply deleted - `rman version` is already a no-op when nothing warrants a bump, so the
#     gate in front of it never had anything to add. The reasoning the old docs gave for it
#     ("`changed` is not the release signal") was right and argued for removing it, not keeping it.
#   - npm auth moved into `panates/gh-setup-node@v2`, which is the only place that knows which file
#     npm reads. Configuring it here as well is how a token ends up in a file npm never opens.
#   - `npm install -g npm@latest` is gone. It was insurance against a runner image moving and it
#     moved the runner instead: Node 24 ships npm 11.19.0, past the 11.5.1 that Trusted Publishing
#     needs, and the upgrade took the job to npm 12.1.0 - a major the documented recipe never
#     contemplates, since that recipe has no upgrade step at all.
#
# Consumers must migrate their own `.rmanrc` for rman 2 before pointing at @v3 - see
# docs/node-release.md.

on:
  workflow_call:
    inputs:
      build_script:
        description: "Build script to be executed"
        type: string
        default: "rman build"
      workspace:
        description: "The default working directory on the runner for steps, and the default location of your repository when using the checkout action"
        type: string
        default: ${{ github.workspace }}
      node-version:
        description: "NodeJS version"
        type: string
        default: ""
      github-registries:
        description: "Scopes to route to npm.pkg.github.com (comma separated), or \"auto\". Needed only to INSTALL a dependency hosted there - publishing is routed by each package's own publishConfig.registry and authenticated by PERSONAL_ACCESS_TOKEN"
        type: string
        required: false
      cache-key:
        description: "Cache key to be restored"
        type: string
        required: false
      cache-path:
        description: "Path which cache will be restored"
        type: string
        required: false
      stage-repository:
        description: "Git repository for stage files"
        type: string
      stage-repository-branch:
        description: "Git repository for stage files"
        type: string
        default: "main"
      stage-files:
        description: "<cr> delimited pairing of <Package name=Stage files>"
        type: string
    secrets:
      PERSONAL_ACCESS_TOKEN:
        description: "Github personal access token. Needed for npm.pkg.github.com, and for 'stage-repository' (a different repository, which the job's own GITHUB_TOKEN cannot reach). Not needed for git here - the checkout and 'version --push' use the job's GITHUB_TOKEN"
        required: false
      NPM_TOKEN:
        description: "npmjs.org auth token - omit entirely once the package is registered as an npm Trusted Publisher (OIDC). npm.pkg.github.com auth always uses PERSONAL_ACCESS_TOKEN regardless, since Trusted Publishing is npmjs.org only"
        required: false
      DOCKERHUB_NAMESPACE:
        description: "Dockerhub namespace. Required if 'stage-repository' defined, or a bare (no \"/\") publish.docker.image is used"
        required: false
      DOCKERHUB_USERNAME:
        description: "Dockerhub username. Required if any package's .rmanrc \"publish.target\" includes \"docker\""
        required: false
      DOCKERHUB_PASS:
        description: "Dockerhub password. Required if any package's .rmanrc \"publish.target\" includes \"docker\""
        required: false

permissions:
  id-token: write # npm Trusted Publishing (OIDC) - also needed on the CALLER workflow's own job
  contents: write # rman version --push, and the GitHub Release itself

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    env:
      # Floating major - picks up every 2.x fix/feature automatically (trusting semver's own
      # major-version breaking-change boundary), without needing a coordinated github-actions
      # release for each one, while still never jumping to a 3.x that could change the CLI
      # behavior these steps depend on. Bumping the major is a maintenance decision made here,
      # not something a consumer repo should drift independently.
      RMAN_VERSION: "2"
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      released: ${{ steps.publish.outputs.count != '0' }}

    steps:
      # Installs rman globally at RMAN_VERSION, so every step below - `build_script` included -
      # runs the same pinned CLI. v2 left `build_script`'s `rman build` resolving whatever
      # `npm i rman -g` had put on PATH (unpinned `latest`) while every other step pinned with
      # `npx rman@<major>`. They agreed only by accident, and would part company the moment a new
      # rman major reached `latest`: the build would jump while version and publish stayed behind.
      - name: "Setup Environment"
        uses: panates/gh-setup-node@v2
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          fetch-depth: 0 # rman resolves each package's release boundary from its own last tag
          node-version: ${{ inputs.node-version }}
          github-registries: ${{ inputs.github-registries }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          rman-version: ${{ env.RMAN_VERSION }}
          install: "ci"

      - name: "Configure git identity"
        working-directory: ${{ inputs.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "Restore Cache"
        if: ${{ inputs.cache-key != '' && inputs.cache-path != '' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}

      - name: "Print Info"
        working-directory: ${{ inputs.workspace }}
        run: |
          echo "=== rman info ===" # Node + whichever package manager .rmanrc actually configures
          rman info

          echo "=== WORKFLOW ==="
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"

          echo "=== RESTORED CACHE ==="
          ls -R "${{ inputs.cache-path }}" 2>/dev/null || echo "Cache path not found"

      - name: "Docker login"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASS }}
        run: |
          # Up here, ahead of "Version", so bad credentials surface before anything has been
          # written: "Version" is the first step that mutates the repository, and a failure after it
          # leaves a bump and a tag already pushed with nothing released.
          # It's needed this early anyway - "Publish" decides whether a Docker package is already
          # released with "docker manifest inspect", which reads the local credentials.
          # Unauthenticated, a *private* image reads as "no such manifest", so an already-published
          # version would look unpublished and the whole pipeline would run to push it again.
          # A no-op for a repo that ships no Docker images and passes no credentials.
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "No DOCKERHUB_USERNAME - skipping."
          fi

      # Unconditional, and that is the v3 change. Severity always comes from rman's own reading of
      # the commits since each package's last tag (conventional-commit prefixes, with a
      # "Release-As:" footer as the one-off override) - never a static input here, which would
      # apply identically to every future run. It writes nothing when no package has commits
      # warranting a bump, so it needs no gate: the `rman changed` step that used to stand in front
      # of it was answering a different question, and answering it wrongly for the two cases that
      # matter most - a version bumped locally and merged in, and an earlier run whose publish
      # failed after the tag was pushed. Both read "nothing changed" and both are due to publish.
      #
      # Ahead of the build on purpose: the published artifact carries whatever version its
      # package.json held when it was built.
      - name: "Version"
        working-directory: ${{ inputs.workspace }}
        run: rman version --yes --push --allow-branch main

      # **rman writes package.json and does not manage lockfiles, so the release commit leaves
      # package-lock.json holding the previous version.** rman is ecosystem-agnostic and a lockfile
      # is npm's concept, so this is the caller's job rather than a gap in rman.
      #
      # **npm will not tell you.** Measured on a real release: with package.json at 2.0.0 and the
      # lock still at 2.0.0-beta.5, `npm ci` answered `change rman 2.0.0 => 2.0.0-beta.5` and exit
      # 0. That is the one drift npm stays quiet about - a *dependency* in package.json that the
      # lock does not have fails loudly with EUSAGE (measured too), but a workspace's own `version`
      # field does not. So without this step the lockfile rots from one release to the next and
      # nothing ever goes red: Dependabot and any SBOM or audit tooling keep reading a stale record,
      # and the next plain `npm install` rewrites it into an unrelated pull request's diff.
      #
      # The install itself is unaffected either way - a workspace package is a symlink, so the real
      # version is served regardless. This is a record being wrong, not a broken tree.
      #
      # **Its own commit, never `--amend`.** `version --push` has already pushed the release commit
      # and its tags; amending would mean force-pushing and moving a published tag.
      #
      # Runs whatever `version` did - it also repairs a lockfile that drifted in an earlier release,
      # and is a no-op when there is nothing to sync. The push does not re-trigger this workflow,
      # since GITHUB_TOKEN pushes deliberately do not start workflow runs.
      - name: "Sync the lockfile to the versions Version wrote"
        working-directory: ${{ inputs.workspace }}
        run: |
          set -euo pipefail
          npm install --package-lock-only
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches the manifests - nothing to sync."
          else
            git add package-lock.json
            git commit -m "chore: sync lockfile"
            git push
            echo "Committed the regenerated lockfile."
          fi

      - name: "Build"
        working-directory: ${{ inputs.workspace }}
        shell: bash
        run: |
          # Unconditional: a package may need its in-repo dependencies built even on a run that
          # ends up publishing nothing, and "Publish" below decides for itself what is actually due.
          ${{ inputs.build_script }}

      - name: "Publish"
        id: publish
        working-directory: ${{ inputs.workspace }}
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASS }}
        run: |
          # No --target here - each package's own .rmanrc "publish.target" is the single source of
          # truth for whether it goes to npm, docker, both, or neither. Which registry each npm
          # package goes to is likewise its own "publishConfig.registry"; rman 2 asks that same
          # registry whether the version is already out there, where earlier versions asked
          # npmjs.org about every package regardless.
          #
          # The plan is computed first only to record what this run releases: "publish" itself
          # already publishes nothing when nothing is due, so this is not a gate - it's the signal
          # "stage_deploy" needs to stay off the manifest repository on a run that released nothing,
          # and it puts the reason in the log when a release doesn't happen.
          json=$(rman publish --dry-run --json)
          echo "$json"
          echo "count=$(echo "$json" | jq '[.[] | select(.status == "publish")] | length')" >> "$GITHUB_OUTPUT"

          rman publish --yes

      - name: "GitHub Release"
        working-directory: ${{ inputs.workspace }}
        env:
          # GithubReleaseService reads GITHUB_TOKEN, falling back to GH_TOKEN. The job's own token
          # is enough - the release is cut in this repository, and `contents: write` is declared
          # above. PERSONAL_ACCESS_TOKEN is preferred when present only so a repo that already
          # relies on its wider scopes keeps behaving as it did.
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Unconditional, and deliberately not an input: a GitHub Release isn't somewhere a package
          # ships to (that's .rmanrc "publish.target" - npm, Docker Hub, GitHub Packages), it's the
          # repository's own record that a version shipped, and every repo wants that record. Making
          # it opt-in would just mean some repos silently stop having one.
          # It's a no-op when there's nothing new: the release is named after the tag "version"
          # created, and a tag that already has a release reads "up-to-date".
          # After "Publish", so a failed npm/docker push doesn't leave a release announcing code
          # that never reached a registry. The notes rman generates are bounded by the previous
          # release and headed with each package's own version - which is why this can't be a
          # generic release action: before the bump the version isn't known, after the tag exists
          # the boundary can't be found, and rman is the only thing here that knows both.
          rman github-release --yes

      - name: "List packages"
        id: list
        working-directory: ${{ inputs.workspace }}
        run: |
          json=$(rman list --json)
          echo "packages=$json" >> "$GITHUB_OUTPUT"

  stage_deploy:
    if: ${{ inputs.stage-repository != '' && needs.release.outputs.released == 'true' }}
    name: Stage Deploy
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifest repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.stage-repository }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ref: ${{ inputs.stage-repository-branch }}

      - name: Update image in deployment yaml
        uses: panates/github-actions/.github/actions/stage-deploy@v3
        with:
          packages: ${{ needs.release.outputs.packages }}
          dockerhub-namespace: ${{ secrets.DOCKERHUB_NAMESPACE }}
          docherhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          docherhub-password: ${{ secrets.DOCKERHUB_PASS }}
          stage-files: ${{ inputs.stage-files }}
