name: "Release"
on:
  workflow_call:
    inputs:
      build_script:
        description: "Build script to be executed"
        type: string
        default: "rman build"
      workspace:
        description: "The default working directory on the runner for steps, and the default location of your repository when using the checkout action"
        type: string
        default: ${{ github.workspace }}
      node-version:
        description: "NodeJS version"
        type: string
        default: ""
      github-registries:
        description: "Namespaces of github registries (comma separated)"
        type: string
        required: false
      cache-key:
        description: "Cache key to be restored"
        type: string
        required: false
      cache-path:
        description: "Path which cache will be restored"
        type: string
        required: false
      stage-repository:
        description: "Git repository for stage files"
        type: string
      stage-repository-branch:
        description: "Git repository for stage files"
        type: string
        default: "main"
      stage-files:
        description: "<cr> delimited pairing of <Package name=Stage files>"
        type: string
    secrets:
      PERSONAL_ACCESS_TOKEN:
        description: "Github personal access token"
        required: true
      NPM_TOKEN:
        description: "npmjs.org auth token - omit entirely once the package is registered as an npm Trusted Publisher (OIDC); npm.pkg.github.com auth always uses PERSONAL_ACCESS_TOKEN regardless"
        required: false
      DOCKERHUB_NAMESPACE:
        description: "Dockerhub namespace. Required if 'stage-repository' defined, or a bare (no \"/\") publish.docker.image is used"
        required: false
      DOCKERHUB_USERNAME:
        description: "Dockerhub username. Required if any package's .rmanrc \"publish.target\" includes \"docker\""
        required: false
      DOCKERHUB_PASS:
        description: "Dockerhub password. Required if any package's .rmanrc \"publish.target\" includes \"docker\""
        required: false

permissions:
  id-token: write # npm Trusted Publishing (OIDC) - also needed on the CALLER workflow's own job
  contents: write # rman version --push, and the GitHub Release itself

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    env:
      # Floating major, not exposed as a workflow input - picks up every 1.x fix/feature
      # automatically (trusting semver's own major-version breaking-change boundary), without
      # needing a coordinated github-actions release for each one, while still never jumping to a
      # 2.x that could change the CLI behavior these steps depend on. Bumping the major is a
      # maintenance decision made here, not something a consumer repo should drift independently.
      RMAN_VERSION: "1"
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      released: ${{ steps.publish.outputs.count != '0' }}

    steps:
      - name: "Setup Environment"
        uses: panates/gh-setup-node@v1
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          fetch-depth: 0 # rman's own tag/changelog detection needs full history, not just the last N commits
          node-version: ${{ inputs.node-version }}
          github-registries: ${{ inputs.github-registries }}

      - name: "Configure git identity"
        working-directory: ${{ inputs.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "Restore Cache"
        if: ${{ inputs.cache-key != '' && inputs.cache-path != '' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}

      - name: "Print Info"
        working-directory: ${{ inputs.workspace }}
        run: |
          echo "=== rman info ===" # Node + whichever package manager .rmanrc actually configures
          npx --yes "rman@$RMAN_VERSION" info

          echo "=== WORKFLOW ==="
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"

          echo "=== RESTORED CACHE ==="
          ls -R "${{ inputs.cache-path }}" 2>/dev/null || echo "Cache path not found"

      - name: "Docker login"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASS }}
        run: |
          # Up here, ahead of "Version", so bad credentials surface before anything has been
          # written: "Version" is the first step that mutates the repository, and a failure after it
          # leaves a bump and a tag already pushed with nothing released.
          # It's needed this early anyway - "What to publish" decides whether a Docker package is
          # already released with "docker manifest inspect", which reads the local credentials.
          # Unauthenticated, a *private* image reads as "no such manifest", so an already-published
          # version would look unpublished and the whole pipeline would run to push it again.
          # A no-op for a repo that ships no Docker images and passes no credentials.
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "No DOCKERHUB_USERNAME - skipping."
          fi

      - name: "What changed"
        id: changed
        working-directory: ${{ inputs.workspace }}
        run: |
          # Only decides whether a NEW version number is warranted, nothing else. It answers a
          # commit-driven question ("what landed since each package's last release"), so it is
          # correctly empty whenever the bump already happened - a version cut locally and merged
          # in, or an earlier run of this workflow. Gating the release on it would skip exactly
          # those cases; that gate is "What to publish" below.
          json=$(npx --yes "rman@$RMAN_VERSION" changed --json)
          echo "count=$(echo "$json" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "$json"

      - name: "Version"
        if: ${{ steps.changed.outputs.count != '0' }}
        working-directory: ${{ inputs.workspace }}
        run: |
          # Severity always comes from rman's own auto-detection (conventional-commit prefixes,
          # a "Release-As: patch|minor|major" commit-body footer to force a one-off exception) -
          # never a static override here, which would apply identically to every future run
          # regardless of what actually changed. Excluding a package from publish/changelog
          # entirely is .rmanrc "publish.skip" (version itself never consults it), not a workflow
          # input either - see docs/node-release.md. No --changelog flag here either, on purpose -
          # set .rmanrc "version.changelog": true if you want it folded into every bump commit, so
          # a manual local "rman version" run (see docs/node-release.md) behaves identically to
          # this one, rather than a flag someone can forget on either side.
          npx --yes "rman@$RMAN_VERSION" version --yes --push --allow-branch main

      - name: "Build"
        working-directory: ${{ inputs.workspace }}
        shell: bash
        run: |
          # Unconditional: a package may need its in-repo dependencies built even on a run that
          # ends up publishing nothing, and "Publish" below decides for itself what is actually due.
          ${{ inputs.build_script }}

      - name: "Ensure npm supports Trusted Publishing (OIDC)"
        run: npm install -g npm@latest

      - name: "Configure npm auth"
        working-directory: ${{ inputs.workspace }}
        run: |
          # Only written when actually given - a package with neither line present, and no
          # NPM_TOKEN, falls through to npm's own OIDC Trusted Publishing (see docs/node-release.md).
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
          fi
          if [ -n "${{ inputs.github-registries }}" ]; then
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.PERSONAL_ACCESS_TOKEN }}" >> ~/.npmrc
          fi

      - name: "Publish"
        id: publish
        working-directory: ${{ inputs.workspace }}
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASS }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          # No --target here - each package's own .rmanrc "publish.target" is the single source of
          # truth for whether it goes to npm, docker, both, or neither (default ["npm"]). Disabling
          # a target for one run would just be a second, workflow-level place that decision could
          # live - forcing it into .rmanrc keeps it in one place.
          #
          # This also cuts the GitHub Release, for a repo whose root .rmanrc lists "github" as a
          # target: one release per run, named after the repository's own release tag, with notes
          # rman generates itself - bounded by the previous release and headed with each package's
          # own version. There is deliberately no separate release step here: generating notes
          # before the bump can't know the version being released, and generating them after can't
          # find the boundary, so neither ordering is right from a workflow.
          #
          # The plan is computed first only to record what this run releases: "publish" itself
          # already publishes nothing when nothing is due, so this is not a gate - it's the signal
          # "stage_deploy" needs to stay off the manifest repository on a run that released nothing,
          # and it puts the reason in the log when a release doesn't happen.
          json=$(npx --yes "rman@$RMAN_VERSION" publish --dry-run --json)
          echo "$json"
          echo "count=$(echo "$json" | jq '[.[] | select(.status == "publish")] | length')" >> "$GITHUB_OUTPUT"

          npx --yes "rman@$RMAN_VERSION" publish --yes

      - name: "List packages"
        id: list
        working-directory: ${{ inputs.workspace }}
        run: |
          json=$(npx --yes "rman@$RMAN_VERSION" list --json)
          echo "packages=$json" >> "$GITHUB_OUTPUT"

  stage_deploy:
    if: ${{ inputs.stage-repository != '' && needs.release.outputs.released == 'true' }}
    name: Stage Deploy
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifest repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.stage-repository }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ref: ${{ inputs.stage-repository-branch }}

      - name: Update image in deployment yaml
        uses: panates/github-actions/.github/actions/stage-deploy@v2
        with:
          packages: ${{ needs.release.outputs.packages }}
          dockerhub-namespace: ${{ secrets.DOCKERHUB_NAMESPACE }}
          docherhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          docherhub-password: ${{ secrets.DOCKERHUB_PASS }}
          stage-files: ${{ inputs.stage-files }}
